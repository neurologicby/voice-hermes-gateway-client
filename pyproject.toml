[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-gateway-client"
version = "0.1.0"
description = "Open-source Windows desktop client for Hermes VoiceGateway"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "GPL-3.0-or-later"
dependencies = [
    "PySide6==6.11.0",
    "websockets==15.0.1",
]

[project.scripts]
voice-client = "voice_client.app:main"

[project.optional-dependencies]
dev = [
    "mypy==1.17.1",
    "pytest==8.4.1",
    "pytest-qt==4.5.0",
    "ruff==0.12.10",
]
audio = [
    "numpy==2.4.3",
    "onnxruntime==1.27.0",
    "sherpa-onnx==1.13.4",
    "sounddevice==0.5.2",
]
packaging = [
    "pyinstaller==6.16.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["voice_client*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.11"
strict = true
