name: Windows installer

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Installer version"
        required: true
        default: "0.1.0"
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install build dependencies
        run: python -m pip install ".[audio,dev,packaging]"
      - name: Test
        run: python -m pytest -q
      - name: Static checks
        run: |
          ruff check .
          mypy voice_client
      - name: Install NSIS
        run: choco install nsis --yes --no-progress
      - name: Build application and installer
        shell: pwsh
        run: |
          $version = if ("${{ github.ref_type }}" -eq "tag") {
            "${{ github.ref_name }}".TrimStart("v")
          } else {
            "${{ inputs.version }}"
          }
          .\packaging\build.ps1 -Python (Get-Command python).Source -Version $version
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoiceGatewayClient-Windows-Setup
          path: dist/VoiceGatewayClient-*-Setup.exe
          if-no-files-found: error
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installer = Get-ChildItem dist\VoiceGatewayClient-*-Setup.exe | Select-Object -First 1
          gh release create "${{ github.ref_name }}" $installer.FullName --generate-notes
